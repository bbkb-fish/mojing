# Copy this file to backend/config/application-local.yml for local development.
# Never commit real passwords or API keys.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/bbkb_novel?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai

mojing:
  migration:
    # 仅旧数据库首次迁移时设置一次，完成后立即移除。
    legacy-owner-id: ${LEGACY_NOVEL_OWNER_ID:0}
  security:
    jwt-secret: ${JWT_SECRET:replace-with-at-least-32-random-characters}
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-attempt-window: ${LOGIN_ATTEMPT_WINDOW:10m}
    login-block-duration: ${LOGIN_BLOCK_DURATION:15m}
    jwt-ttl: ${JWT_TTL:12h}
  ai:
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    model: ${AI_MODEL:deepseek-flash}
  embedding:
    api-key: ${EMBEDDING_API_KEY:}
    base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${EMBEDDING_MODEL:text-embedding-v4}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}
  qdrant:
    base-url: ${QDRANT_BASE_URL:http://127.0.0.1:6333}
    api-key: ${QDRANT_API_KEY:}
    collection: ${QDRANT_COLLECTION:novel_memory}
    story-bible-collection: ${QDRANT_STORY_BIBLE_COLLECTION:novel_story_bible_chat}
    vector-size: ${QDRANT_VECTOR_SIZE:1024}
