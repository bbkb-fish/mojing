name: mojing

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 850m
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: mojing_novel
      MYSQL_USER: mojing
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
    secrets:
      - mysql_root_password
      - mysql_app_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - app

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    mem_limit: 640m
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app

  backend:
    image: eclipse-temurin:21-jre-alpine
    restart: unless-stopped
    mem_limit: 1100m
    working_dir: /app
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export DB_PASSWORD="$$(cat /run/secrets/mysql_app_password)"
        export JWT_SECRET="$$(cat /run/secrets/jwt_secret)"
        export AI_API_KEY="$$(cat /run/secrets/ai_api_key)"
        export EMBEDDING_API_KEY="$$(cat /run/secrets/embedding_api_key)"
        exec java -Xms192m -Xmx768m -jar /app/app.jar
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://mysql:3306/mojing_novel?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: mojing
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      AI_BASE_URL: https://api.deepseek.com
      AI_MODEL: deepseek-flash
      EMBEDDING_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      EMBEDDING_MODEL: text-embedding-v4
      QDRANT_BASE_URL: http://qdrant:6333
      TZ: Asia/Shanghai
    secrets:
      - mysql_app_password
      - jwt_secret
      - ai_api_key
      - embedding_api_key
    volumes:
      - ./app.jar:/app/app.jar:ro
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - app

  frontend:
    image: nginx:1.28-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - 0.0.0.0:80:80
      - 127.0.0.1:8080:80
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password
  mysql_app_password:
    file: ./secrets/mysql_app_password
  jwt_secret:
    file: ./secrets/jwt_secret
  ai_api_key:
    file: ./secrets/ai_api_key
  embedding_api_key:
    file: ./secrets/embedding_api_key

volumes:
  mysql_data:
  qdrant_data:

networks:
  app:
